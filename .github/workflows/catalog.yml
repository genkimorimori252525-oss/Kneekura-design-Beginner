name: Validate AI design catalog
on:
  push:
    paths:
      - 'catalog/**'
      - 'tools/catalog.mjs'
      - '.github/workflows/catalog.yml'
  pull_request:
    paths:
      - 'catalog/**'
      - 'tools/catalog.mjs'
      - '.github/workflows/catalog.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalog relations
        run: node tools/catalog.mjs validate
      - name: Verify compatibility safety invariants
        run: node tools/catalog.mjs self-test
      - name: Smoke-test machine-readable agent recommendation
        run: node tools/catalog.mjs recommend minecraft-gui --target minecraft-forge-gui --json > /dev/null
      - name: Smoke-test compatibility-filtered search
        run: node tools/catalog.mjs search --genre motion --target react-web --code direct --json > /dev/null
